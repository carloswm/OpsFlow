name: CD to AWS sandbox

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Publish and deploy approved main build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.AWS_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-sandbox
    concurrency:
      group: opsflow-aws-sandbox
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_API_SERVICE_NAME: ${{ vars.ECS_API_SERVICE_NAME }}
      ECS_WEB_SERVICE_NAME: ${{ vars.ECS_WEB_SERVICE_NAME }}
      ECR_API_REPOSITORY_NAME: ${{ vars.ECR_API_REPOSITORY_NAME }}
      ECR_WEB_REPOSITORY_NAME: ${{ vars.ECR_WEB_REPOSITORY_NAME }}
      APPLICATION_URL: ${{ vars.APPLICATION_URL }}
      OPSFLOW_IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: OpsFlowCD-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Publish images, migrate the database, deploy and smoke test
        shell: bash
        run: bash deploy/aws/deploy-ecs.sh
